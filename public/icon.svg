<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Deep black background with subtle inner glow -->
    <radialGradient id="bg" cx="50%" cy="42%" r="88%">
      <stop offset="0%"  stop-color="#161616"/>
      <stop offset="65%" stop-color="#070707"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <!-- Champagne / pale gold (matches reference) -->
    <linearGradient id="champagne" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#fff3c4"/>
      <stop offset="50%"  stop-color="#f0d977"/>
      <stop offset="100%" stop-color="#cba83e"/>
    </linearGradient>
  </defs>

  <!-- Canvas -->
  <rect width="512" height="512" rx="120" fill="url(#bg)"/>

  <!-- ── Soccer ball ── -->
  <g transform="translate(256 200)">
    <!-- Ball body — champagne gold -->
    <circle r="138" fill="url(#champagne)"/>

    <!-- Subtle hex-panel seam lines (very faint) -->
    <g stroke="#9a7a26" stroke-width="1.5" fill="none" opacity="0.35" stroke-linecap="round">
      <line x1="0"    y1="-40"  x2="0"    y2="-85"/>
      <line x1="38"   y1="-12"  x2="82"   y2="-28"/>
      <line x1="24"   y1="34"   x2="50"   y2="70"/>
      <line x1="-24"  y1="34"   x2="-50"  y2="70"/>
      <line x1="-38"  y1="-12"  x2="-82"  y2="-28"/>
    </g>

    <!-- Black pentagons — classic Telstar pattern -->
    <g fill="#080808">
      <!-- Center -->
      <polygon points="0,-40 38,-12 24,34 -24,34 -38,-12"/>

      <!-- Top -->
      <g transform="translate(0 -85) rotate(180)">
        <polygon points="0,-28 26.6,-8.7 16.4,22.6 -16.4,22.6 -26.6,-8.7"/>
      </g>
      <!-- Upper-right -->
      <g transform="translate(82 -28) rotate(252)">
        <polygon points="0,-28 26.6,-8.7 16.4,22.6 -16.4,22.6 -26.6,-8.7"/>
      </g>
      <!-- Lower-right -->
      <g transform="translate(50 70) rotate(324)">
        <polygon points="0,-28 26.6,-8.7 16.4,22.6 -16.4,22.6 -26.6,-8.7"/>
      </g>
      <!-- Lower-left -->
      <g transform="translate(-50 70) rotate(36)">
        <polygon points="0,-28 26.6,-8.7 16.4,22.6 -16.4,22.6 -26.6,-8.7"/>
      </g>
      <!-- Upper-left -->
      <g transform="translate(-82 -28) rotate(108)">
        <polygon points="0,-28 26.6,-8.7 16.4,22.6 -16.4,22.6 -26.6,-8.7"/>
      </g>
    </g>
  </g>

  <!-- ── SYNTHETICO wordmark ── -->
  <text x="256" y="430"
        font-family="Impact, 'Arial Black', 'Helvetica Neue', sans-serif"
        font-weight="900" font-size="64"
        fill="url(#champagne)"
        text-anchor="middle"
        letter-spacing="3">SYNTHETICO</text>
</svg>
