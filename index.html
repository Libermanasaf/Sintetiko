<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <script>
      // Apply saved theme immediately to avoid flash
      const saved = localStorage.getItem('theme');
      if (saved === 'light') {
        document.documentElement.classList.remove('dark');
      } else {
        document.documentElement.classList.add('dark');
      }
    </script>
